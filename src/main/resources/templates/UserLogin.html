<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User Login</title>
<style>
/* BODY AND BACKGROUND */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* LOGIN FORM CARD */
.login-container {
    text-align: center;
    background: #fff;
    padding: 40px 35px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    width: 320px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.login-container:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.3);
}

/* HEADING */
h1 {
    margin-bottom: 25px;
    color: #333;
    font-size: 24px;
    font-weight: bold;
}

/* FORM FIELDS */
form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input[type="text"], input[type="password"] {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    width: 100%;
    box-sizing: border-box;
    transition: border-color 0.3s, box-shadow 0.3s;
}

input[type="text"]:focus, input[type="password"]:focus {
    border-color: #4CAF50;
    box-shadow: 0 0 6px rgba(76, 175, 80, 0.3);
}

/* LOGIN BUTTON */
input[type="submit"] {
    padding: 12px;
    border: none;
    background: linear-gradient(135deg, #4CAF50, #45a049);
    color: white;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
}

input[type="submit"]:hover {
    background: linear-gradient(135deg, #45a049, #4CAF50);
    transform: scale(1.05);
}

input[type="submit"]:active {
    transform: scale(0.95);
}

/* PLACEHOLDER COLOR */
input::placeholder {
    color: #aaa;
}

/* ERROR MESSAGE */
.error-msg {
    color: red;
    font-weight: bold;
    text-align: center;
    min-height: 20px;
    font-size: 14px;
}

/* BACK TO HOME BUTTON */
.back-home-form {
    text-align: center;
    margin-top: 20px;
    width: 320px;
}

.back-home-form input[type="submit"] {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #2196F3, #1976D2);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.3s ease;
}

.back-home-form input[type="submit"]:hover {
    background: linear-gradient(135deg, #1976D2, #2196F3);
    transform: scale(1.05);
}

.back-home-form input[type="submit"]:active {
    transform: scale(0.95);
}
</style>
</head>
<body>
    <div class="login-container">
        <h1>User Login</h1>
        <form action="userloginrequest">
            <input type="text" placeholder="Email Id" name="emailId" required>
            <input type="password" placeholder="Password" name="password" required>
            <input type="submit" value="Login">
            <div class="error-msg"
                th:if="${#strings.equalsIgnoreCase(loginstatus,'Login Failed')}"
                th:text="${loginstatus}"></div>
        </form>
    </div>

    <form action="homepage" method="get" class="back-home-form">
        <input type="submit" value="Back to Home Page">
    </form>
</body>
</html>
