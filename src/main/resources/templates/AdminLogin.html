<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<style>

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* LOGIN CONTAINER */
.login-container {
    text-align: center;
    background: #fff;
    padding: 40px 35px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    width: 320px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.login-container:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.3);
}

/* HEADING */
h1 {
    margin-bottom: 25px;
    color: #333;
    font-size: 26px;
    font-weight: bold;
}

/* FORM */
form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* INPUT FIELDS */
input[type="text"], input[type="password"] {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    width: 100%;
    box-sizing: border-box;
    transition: 0.3s;
}

input[type="text"]:focus, input[type="password"]:focus {
    border-color: #6a11cb;
    box-shadow: 0 0 8px rgba(106, 17, 203, 0.3);
    outline: none;
}

/* LOGIN BUTTON */
input[type="submit"] {
    padding: 12px;
    border: none;
    background-color: #4CAF50;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s ease;
}

input[type="submit"]:hover {
    background-color: #45a049;
    transform: scale(1.05);
}

input[type="submit"]:active {
    transform: scale(0.95);
}

/* PLACEHOLDER COLOR */
input::placeholder {
    color: #aaa;
}

/* ERROR MESSAGE */
.error-msg {
    color: #ff5722;
    font-weight: bold;
    text-align: center;
    min-height: 20px;
    font-size: 14px;
    background-color: #fff3e0;
    padding: 8px 12px;
    border-radius: 6px;
    margin-top: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* BACK TO HOME BUTTON */
.back-home-form {
    text-align: center;
    margin-top: 20px;
    width: 320px;
}

.back-home-form input[type="submit"] {
    width: 100%;
    padding: 12px;
    background-color: #2196F3;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.3s ease;
}

.back-home-form input[type="submit"]:hover {
    background-color: #1976D2;
    transform: scale(1.03);
}

.back-home-form input[type="submit"]:active {
    transform: scale(0.95);
}
</style>
</head>
<body>
	<div class="login-container">
		<h1>Admin Login</h1>
		<form action="adminloginvalidation" method="post">
			<input type="text" placeholder="Email Id" name="emailId" required>
			<input type="password" placeholder="Password" name="password" required>
			<input type="submit" value="Login">

			<div class="error-msg"
				th:if="${#strings.equalsIgnoreCase(loginmsg,'Login Failed')}"
				th:text="${loginmsg}"></div>
		</form>
	</div>

	<form action="homepage" method="get" class="back-home-form">
		<input type="submit" value="Back to Home Page">
	</form>
</body>
</html>
