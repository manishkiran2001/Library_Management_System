<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Book Details</title>
<style>
/* BODY AND BACKGROUND */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* HEADING */
h1 {
    color: #333;
    margin-bottom: 15px;
    font-size: 24px;
    text-align: center;
    font-weight: bold;
}

/* WELCOME MESSAGE */
.welcome-msg {
    text-align: center;
    margin-bottom: 15px;
    font-weight: bold;
    color: #333;
    font-size: 16px;
}

/* FORM STYLING */
form.add-book-form {
    background: #fff;
    padding: 25px 20px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    width: 320px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

form.add-book-form:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.3);
}

label {
    display: block;
    margin-top: 10px;
    margin-bottom: 5px;
    font-weight: bold;
    color: #444;
    font-size: 14px;
}

input[type="text"], input[type="tel"], input[type="password"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
}

input[type="text"]:focus, input[type="tel"]:focus, input[type="password"]:focus {
    border-color: #6a11cb;
    box-shadow: 0 0 8px rgba(106, 17, 203, 0.3);
}

/* SUBMIT BUTTON */
input[type="submit"] {
    width: 100%;
    background: linear-gradient(135deg, #4CAF50, #45a049);
    color: white;
    border: none;
    padding: 12px;
    margin-top: 12px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

input[type="submit"]:hover {
    background: linear-gradient(135deg, #45a049, #4CAF50);
    transform: scale(1.05);
}

input[type="submit"]:active {
    transform: scale(0.95);
}

/* FIELD ERROR MESSAGES */
span {
    color: red;
    font-size: 12px;
}

/* STATUS MESSAGE */
#book_status {
    font-size: 1.2em;
    color: green;
    font-weight: bold;
    text-align: center;
    margin-top: 10px;
    padding: 6px 10px;
    border-radius: 6px;
    background-color: #e8f5e9;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* BUTTON GROUP */
.button-group {
    display: flex;
    justify-content: center;
    gap: 20px; 
    margin-top: 20px;
    flex-wrap: wrap;
}

.button-group form {
    margin: 0; 
}

.button-group input[type="submit"] {
    width: 180px; 
    padding: 10px;
    background: linear-gradient(135deg, #2196F3, #1976D2);
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: all 0.3s ease;
}

.button-group input[type="submit"]:hover {
    background: linear-gradient(135deg, #1976D2, #2196F3);
    transform: scale(1.05);
}

.button-group input[type="submit"]:active {
    transform: scale(0.95);
}
</style>
</head>
<body>

    <h1>Add Books</h1>

    <div class="welcome-msg" th:text="'Welcome, ' + ${loginmsg}" name="adminName"></div>

    <form action="insertbookdetails" class="add-book-form">
        <input type="hidden" name="adminName" th:value="${loginmsg}">
        <label>Book Title</label> 
        <input type="text" name="bookTitle" placeholder="Book Title"> 
        <span th:text="${allFieldErrors!=null?allFieldErrors['bookTitle']:' '}"></span>
        
        <label>Book Author</label> 
        <input type="text" name="bookAuthor" placeholder="Book Author">
        <span th:text="${allFieldErrors!=null?allFieldErrors['bookAuthor']:' '}"></span>
         
        <label>Book Category</label> 
        <input type="text" name="bookCategory" placeholder="Book Category">
        <span th:text="${allFieldErrors!=null?allFieldErrors['bookCategory']:' '}"></span>
        
        <label>Book Language</label> 
        <input type="text" name="bookLanguage" placeholder="Book Language"> 
        <span th:text="${allFieldErrors!=null?allFieldErrors['bookLanguage']:' '}"></span>
        
        <label>Number Of Pages</label> 
        <input type="tel" name="bookPages" placeholder="Number Of Pages">
        <span th:text="${allFieldErrors!=null?allFieldErrors['bookPages']:' '}"></span>
        
        <label>Book Price</label> 
        <input type="text" name="bookPrice" placeholder="Book Price"> 
        <span th:text="${allFieldErrors!=null?allFieldErrors['bookPrice']:' '}"></span>
        <input type="submit" value="Add Book">
        <div id="book_status" th:if="${status}" th:text="${status}"></div>
    </form>

    <div class="button-group">
        <form action="displayallbookdetails">
         <input type="hidden" th:value="${loginmsg}" name="adminName">
            <input type="submit" value="Display All Books">
        </form>

        <form action="adminloginpage" method="get">
            <input type="submit" value="Back to Admin Login">
        </form>
    </div>

</body>
</html>
